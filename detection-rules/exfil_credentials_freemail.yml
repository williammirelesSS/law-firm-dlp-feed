name: "DLP: Exfil - Credentials and Secrets Sent to Personal Email"
description: |
  Detects passwords, API keys, access tokens, private keys and credential
  files going to a personal webmail account. For a law firm this is mostly
  about logins for client portals, data rooms and court systems leaving with an
  employee, rather than developer secrets.

  Meeting invites carry passcodes that look like passwords, so Zoom, Teams,
  Webex and German dial-in text is excluded. Every exclusion is null-guarded
  so an attachment-only message (a bare .pem or .pfx) is not silently dropped.

  Expected FPs: test or example credentials in vendor emails.
type: "rule"
severity: "high"
source: |
  type.outbound
  and (
    regex.icontains(body.current_thread.text, 'AKIA[0-9A-Z]{16}')
    or regex.icontains(body.current_thread.text,
      '(?:api[_\-]?key|bearer[_\-]?token|access[_\-]?token|secret[_\-]?key)[\s:=]+[\w\-\.]{20,}'
    )
    or regex.icontains(body.current_thread.text,
      '(?:password|passwort|kennwort|passwd|pwd)[\s:=]+[^\s]{8,}'
    )
    or strings.ilike(body.current_thread.text,
      "*password is*", "*passwort lautet*", "*kennwort lautet*", "*api key is*",
      "*private key*", "*login credentials*", "*zugangsdaten*",
      "*username and password*", "*benutzername und passwort*"
    )
    or any(attachments,
      strings.ilike(.file_name,
        "*.env", "*credentials*", "*zugangsdaten*", "*passw*", "*.pem",
        "*id_rsa*", "*.pfx", "*.p12", "*.kdbx"
      )
    )
  )
  and not (
    body.current_thread.text is not null
    and strings.ilike(body.current_thread.text,
      "*zoom.us*", "*teams.microsoft.com*", "*meet.google.com*", "*webex.com*",
      "*passcode*", "*meeting id*", "*besprechungs-id*", "*kenncode*",
      "*einwahl*", "*join the meeting*", "*an besprechung teilnehmen*",
      "*example*", "*placeholder*", "*your_api_key*"
    )
  )
  and not (
    subject.subject is not null
    and strings.ilike(subject.subject,
      "*invitation:*", "*einladung:*", "*accepted:*", "*angenommen:*",
      "*declined:*", "*abgelehnt:*", "*canceled:*", "*abgesagt:*"
    )
  )
  and any(recipients.to + recipients.cc + recipients.bcc,
    .email.domain.root_domain in $free_email_providers
    // German webmail, in case the built-in list does not cover it
    or .email.domain.root_domain in~ (
      "gmx.de", "gmx.net", "gmx.at", "gmx.ch", "web.de", "t-online.de",
      "freenet.de", "posteo.de", "mailbox.org", "arcor.de", "online.de"
    )
  )
detection_methods:
  - "Content analysis"
tags:
  - "DLP"
  - "Law-Firm"
  - "Credentials"
id: "67197f2c-80a1-43f6-9088-92f4b1544f4c"

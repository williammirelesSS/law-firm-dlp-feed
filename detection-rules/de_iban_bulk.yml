name: "DLP: Germany - Multiple IBANs in One Outbound Message (Bank Data List)"
description: |
  Detects five or more German IBANs in the newest message body of an outbound
  email, which indicates a list of bank details (client accounts, payroll,
  escrow / Anderkonto beneficiaries) rather than a normal payment request.

  Based on the official Sublime DLP rule, repackaged as a standard rule and
  changed from "any IBAN" to a count. A law firm prints its own business and
  client-escrow IBANs on every invoice and often in the signature block, so a
  single IBAN match is noise.

  Tuning: if the firm's footer lists several accounts, raise the threshold
  above that number, or exclude the firm's own IBANs explicitly.
type: "rule"
severity: "medium"
source: |
  type.outbound
  and length(regex.extract(body.current_thread.text,
    '\bDE[0-9]{2}\s?(?:[0-9]{4}\s?){4}[0-9]{2}\b'
  )) >= 5
  and any(recipients.to + recipients.cc + recipients.bcc,
    .email.domain.root_domain not in $org_domains
  )
detection_methods:
  - "Content analysis"
tags:
  - "DLP"
  - "Law-Firm"
  - "Germany"
  - "Financial"
id: "72d02c96-c9f1-4c5e-a40b-c698e666e351"

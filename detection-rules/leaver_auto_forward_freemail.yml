name: "DLP: Leaver - Mail Auto-Forwarded to a Personal Address by an Inbox Rule"
description: |
  Detects messages that Exchange forwarded automatically, identified by the
  X-MS-Exchange-Inbox-Rules-Loop or X-MS-Exchange-ForwardingLoop header, where
  the destination is a personal webmail account. An inbox rule that copies
  every client email to a private address is the most complete exfiltration
  channel there is, and it keeps working after the employee has left if the
  mailbox stays open.

  Caveat: auto-forwarded copies are generated by Exchange and do not always land
  in Sent Items, so how much of this traffic Sublime sees depends on how
  outbound mail is ingested. Zero results do not prove there is no forwarding.
  Cross-check against the Exchange forwarding report.

  Expected FPs: very low. Occasionally a sanctioned forward to a personal
  device during leave.
type: "rule"
severity: "high"
source: |
  type.outbound
  and any(headers.hops,
    any(.fields,
      .name in~ ("X-MS-Exchange-Inbox-Rules-Loop", "X-MS-Exchange-ForwardingLoop")
    )
  )
  and any(recipients.to + recipients.cc + recipients.bcc,
    .email.domain.root_domain in $free_email_providers
    // German webmail, in case the built-in list does not cover it
    or .email.domain.root_domain in~ (
      "gmx.de", "gmx.net", "gmx.at", "gmx.ch", "web.de", "t-online.de",
      "freenet.de", "posteo.de", "mailbox.org", "arcor.de", "online.de"
    )
  )
detection_methods:
  - "Header analysis"
tags:
  - "DLP"
  - "Law-Firm"
  - "Leaver"
  - "Auto-Forward"
id: "a566723b-092b-47db-8a48-ae5f747a35f0"

name: "DLP: Purview - Inventory of Sensitivity-Labelled Email Leaving the Firm"
description: |
  Returns every outbound message to an external recipient that carries a
  Microsoft Purview sensitivity label. When a user labels an email in Outlook,
  Microsoft writes the label into the msip_labels header in the form
  MSIP_Label_<guid>_Name=<label name>;... and this rule reads that header.

  This is a sizing and visibility hunt, not an alert. Run it first to see which
  label names are in use and how often labelled mail goes external, then use
  the label names you find to tune the two targeted Purview header rules.

  Expected volume: high in a firm that labels routinely. Do not enable as an
  alerting rule.
type: "rule"
severity: "low"
source: |
  type.outbound
  and any(headers.hops,
    any(.fields,
      .name =~ "msip_labels"
      and strings.icontains(.value, "MSIP_Label_")
    )
  )
  and any(recipients.to + recipients.cc + recipients.bcc,
    .email.domain.root_domain not in $org_domains
  )
detection_methods:
  - "Header analysis"
tags:
  - "DLP"
  - "Law-Firm"
  - "Purview"
  - "Sensitivity-Labels"
id: "cb9ab2ef-8ba3-4d26-a831-c7a8040c8aa4"
